{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "competitive-intelligence.serviceAccountName" . }}
  labels:
    {{- include "competitive-intelligence.labels" . | nindent 4 }}
  # The IRSA role is provisioned by landing-zone's
  # competitive-intelligence-platform component — its trust policy permits
  # assumption by this SA in this namespace, and its inline policy bundles every
  # action the pod needs (Bedrock InvokeModel for Claude Sonnet + Titan Embed v2,
  # Secrets Manager read, CloudWatch PutMetricData). The role ARN is the
  # component's `irsa_role_arn` output; per-env values plumb it into
  # `aws.platformRoleArn`, and the annotation below picks it up. No inline IAM
  # is defined here — the chart only references the role.
  {{- if or .Values.aws.platformRoleArn .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.aws.platformRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aws.platformRoleArn | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
