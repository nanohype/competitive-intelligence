apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
spec:
  # ClusterIP only — no public ingress, no LoadBalancer. Two ports: the health
  # port for in-cluster probes, and the MCP port the mcp-tunnel routes to (the
  # tunnel is the only thing that reaches it — see networkpolicy.yaml).
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
      name: mcp
  selector:
    {{- include "tenant-chart-base.selectorLabels" . | nindent 4 }}
