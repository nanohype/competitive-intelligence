{{- if .Values.externalSecret.enabled -}}
# ExternalSecret syncs the app's secret material from AWS Secrets Manager into a
# Kubernetes Secret that the Deployment's `envFrom` mounts. The chart never holds
# secret values — External Secrets Operator pulls them from the ClusterSecretStore
# (`aws-secrets-manager`, provisioned by the eks-gitops external-secrets addon).
#
# App secrets live at competitive-intelligence/<env>/app-secrets:
#   - Slack: SLACK_BOT_TOKEN (outbound alert sink — chat:write only)
#
# No model credential of any kind. Every model call goes through the Platform's
# ModelGateway, which authenticates to Bedrock with its own EKS Pod Identity —
# so there is no vendor API key for this app to hold, and no way for it to reach
# a model that the gateway has not recorded.
#
# Aurora master credentials live in their own secret
# (competitive-intelligence/<env>/db-credentials), created by the landing-zone
# tenant-substrate component (manage_master_user_password).
# PGUSER + PGPASSWORD map from that secret's username/password keys.
#
# The MCP OAuth resource-server layer (MCP_AUTH=workos) needs NO secret here: it
# only validates tokens against WorkOS's public JWKS. Its config (issuer, public
# URL) is non-secret and rides on the Deployment env from values.env.

# v1, not v1beta1. The external-secrets release the eks-gitops addon installs
# still DECLARES v1beta1 on the CRD but no longer serves it:
#
#   $ kubectl get crd externalsecrets.external-secrets.io \\
#       -o jsonpath='{range .spec.versions[*]}{.name}{" served="}{.served}{"\\n"}{end}'
#   v1      served=true
#   v1beta1 served=false
#
# A declared-but-unserved version is the confusing case: the CRD lists it, so the
# manifest looks like it targets something real, and the install fails at
# admission with `no matches for kind "ExternalSecret" in version
# "external-secrets.io/v1beta1"`. Every field used here is present in v1
# unchanged, and the ClusterSecretStore it references was always v1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}-secrets
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "tenant-chart-base.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # Slack bot token — the outbound alert sink (chat.postMessage). Absent → the
    # radar logs alerts instead of posting.
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefSecret }}
        property: SLACK_BOT_TOKEN
    # Aurora master credentials from the landing-zone-managed secret.
    - secretKey: PGUSER
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: username
    - secretKey: PGPASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.dbCredentialsSecret }}
        property: password
{{- end }}
