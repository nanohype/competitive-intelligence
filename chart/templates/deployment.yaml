apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-chart-base.fullname" . }}
  labels:
    {{- include "tenant-chart-base.labels" . | nindent 4 }}
spec:
  # Single writer: the scheduler runs one global crawl on an interval, guarded by
  # an in-process crawl mutex. Pinned to one replica — see values.yaml. No HPA.
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Recreate, not RollingUpdate: two pods would run two schedulers + two crawl
    # mutexes against the same pgvector store and double-fire alerts during a
    # rollout. Take the old pod down before the new one comes up.
    type: Recreate
  selector:
    matchLabels:
      {{- include "tenant-chart-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-chart-base.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when the ExternalSecret-managed Secret changes. Without
        # this the Deployment keeps the old env vars cached on the pod spec hash;
        # ExternalSecret writes are otherwise picked up on next pod restart only.
        checksum/external-secret: {{ printf "%s-%s" .Values.externalSecret.remoteRefSecret .Values.externalSecret.refreshInterval | sha256sum }}
    spec:
      serviceAccountName: {{ include "tenant-chart-base.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Non-secret config from values.env
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # Aurora pgvector connection — fed by per-env Helm values from the
            # landing-zone competitive-intelligence-platform component's outputs.
            # The `pg` driver reads PGHOST/PGPORT/PGDATABASE natively; PGUSER and
            # PGPASSWORD arrive via the ExternalSecret (envFrom below). Empty base
            # values are the local-dev fallback (VECTOR_PROVIDER=memory).
            - name: PGHOST
              value: {{ .Values.tenantInfra.pgHost | quote }}
            - name: PGPORT
              value: {{ .Values.tenantInfra.pgPort | quote }}
            - name: PGDATABASE
              value: {{ .Values.tenantInfra.pgDatabase | quote }}
          envFrom:
            # Secrets from the ExternalSecret-managed k8s Secret. Names match the
            # AWS Secrets Manager JSON keys (SLACK_BOT_TOKEN, etc.) plus the
            # Aurora-credentials sub-secret keys (PGUSER, PGPASSWORD).
            - secretRef:
                name: {{ include "tenant-chart-base.fullname" . }}-secrets
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on; the app needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
