# Production delta.
image:
  tag: production

# Stays 1: single-writer scheduler + in-process crawl mutex. Scaling out would
# run overlapping crawls and double-fire alerts. Lift only with leader election.
replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

externalSecret:
  remoteRefSecret: competitive-intelligence/production/app-secrets
  dbCredentialsSecret: competitive-intelligence/production/db-credentials

env:
  NODE_ENV: production
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=competitive-intelligence,service.version=0.1.0,deployment.environment=production,agents.tenant=strategy,agents.platform=competitive-intelligence'

tenantInfra:
  # Fill the empties below from the landing-zone tenant-substrate
  # production outputs (terragrunt output -json). Slot names match output names 1:1.
  pgHost: '' # aurora_cluster_endpoint
