# Base values for competitive-intelligence (all environments). Per-env deltas
# in values-{dev,staging,production}.yaml.

image:
  repository: ghcr.io/nanohype/competitive-intelligence
  tag: '' # pinned per-env
  pullPolicy: IfNotPresent

# Single Deployment: the scheduler + crawler, the outbound alert sink, and the
# MCP server all run in ONE process. The scheduler runs one global crawl on an
# interval and an in-process crawl mutex prevents overlapping runs; the MCP
# `trigger_crawl` tool calls that same in-process mutex directly. All three
# assume a single writer. Do NOT scale horizontally without leader election;
# there is no HPA on this Deployment. (A worker/mcp Deployment split is a future
# refinement — it would require exposing the crawl trigger over internal HTTP.)
replicaCount: 1

service:
  type: ClusterIP
  # Health port. The app serves /health + /readyz here (config.port, env PORT).
  port: 3000
  targetPort: 3000
  # MCP streamable-HTTP port. The pull/query surface (config.mcpPort, env
  # MCP_PORT) the mcp-tunnel routes to. Locked to the tunnel by NetworkPolicy.
  mcpPort: 3001
  mcpTargetPort: 3001

serviceAccount:
  create: true
  # Pinned to the app name so it matches the service_account of the EKS Pod
  # Identity association landing-zone's competitive-intelligence-platform
  # component creates — that association binds this ServiceAccount to its IAM
  # role, so the pod needs no role-arn annotation and the chart carries no AWS
  # account values.
  name: competitive-intelligence
  # Free-form additional annotations merged into the ServiceAccount.
  annotations: {}

# Resource attributes the shared chart labels read (tenant-chart-base.labels →
# agents.nanohype.dev/{tenant,platform}). The OTEL_RESOURCE_ATTRIBUTES env var
# under `env:` carries the same values into the app's OTel SDK at runtime.
otel:
  resourceAttributes:
    agents.tenant: protohype
    agents.platform: competitive-intelligence

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  # Matches the image's named `app` user (UID 1001, Dockerfile). A mismatch here
  # leaves the process unable to read files owned by the image user.
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

externalSecret:
  enabled: true
  # ClusterSecretStore name (provisioned by eks-gitops external-secrets addon)
  secretStore: aws-secrets-manager
  refreshInterval: 1h
  # App secrets in AWS Secrets Manager — composed per-env as
  # competitive-intelligence/<env>/app-secrets. Slack tokens + optional
  # provider keys live here.
  remoteRefSecret: '' # set per-env (competitive-intelligence/<env>/app-secrets)
  # Aurora master credentials secret name (provisioned by the landing-zone
  # competitive-intelligence-platform component).
  dbCredentialsSecret: '' # set per-env (competitive-intelligence/<env>/db-credentials)

prometheusRule:
  # Ships SLO recording rules + burn-rate alerts to a Prometheus Operator
  # (kube-prometheus-stack) via the PrometheusRule CR. Off by default — inert
  # without an operator, which the managed-Prometheus stack (grafana-agent + AMP,
  # alerts in Amazon Managed Grafana) doesn't run. Set `enabled: true` on a
  # cluster that runs one.
  enabled: false
  selector:
    release: kube-prometheus-stack

grafanaDashboard:
  # Shipped as a GrafanaDashboard CR the grafana-operator reconciles onto the
  # external Amazon Managed Grafana — the same delivery path the platform
  # dashboards use (the operator runs on both EKS and the local kx cluster).
  enabled: true
  instanceSelector:
    dashboards: external
  allowCrossNamespaceImport: true
  resyncPeriod: 24h

networkPolicy:
  enabled: true
  # Ingress is default-deny except for the two rules below. There is no public
  # ingress and no LoadBalancer — the MCP surface is reachable ONLY through the
  # mcp-tunnel (outbound-only cloudflared), never directly.
  ingress:
    # Health/probe traffic: same-namespace only. Kubelet probes from the node
    # land as same-namespace; the health port serves /health + /readyz and
    # carries no product data.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
    # MCP pull surface: reachable ONLY from the mcp-tunnel namespace. The
    # mcp-tunnel is the single ingress to the MCP server — every other source
    # stays default-deny. This is what makes the app tunnel-ready without
    # opening any public surface.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-tunnel
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # HTTPS to the open internet — the crawler hits arbitrary competitor sites,
    # plus Bedrock and Slack. 169.254.0.0/16 is excluded so pods can never reach
    # the IMDS endpoint (SSRF / credential-exfil guard; Pod Identity is the only path to
    # AWS creds).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16 # IMDS — must NOT be reachable from pods
      ports:
        - protocol: TCP
          port: 443
    # Postgres (Aurora pgvector via the landing-zone component) — endpoint
    # resolved via DNS; egress restricted to the cluster VPC CIDR. Replace
    # 10.0.0.0/8 with the actual VPC CIDR via per-env overrides if tightening
    # is required.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
    # OTLP traces + metrics + logs to the grafana-agent OTLP receiver in the
    # monitoring namespace (grafana-agent.monitoring.svc.cluster.local:4318).
    # Without this rule the default-deny policy drops every span/metric/log.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318

env:
  # Non-secret configuration. Secrets (Slack tokens, optional provider keys,
  # PGUSER/PGPASSWORD) come through the ExternalSecret.
  AWS_REGION: us-west-2
  LLM_PROVIDER: bedrock
  EMBEDDING_PROVIDER: bedrock
  # Cross-region Claude Sonnet inference profile (Converse requires the
  # us.anthropic.*-v1:0 profile form, not a bare alias). Matches the config.ts
  # default. Verify the profile exists in the deploy region before promoting and
  # bump to the current Sonnet snapshot when rolling regions.
  BEDROCK_LLM_MODEL: us.anthropic.claude-sonnet-4-20250514-v1:0
  BEDROCK_EMBEDDING_MODEL: amazon.titan-embed-text-v2:0
  EMBEDDING_DIMENSIONS: '1024'
  # Durable vector store — survives restarts so the first post-restart crawl
  # diffs against real history instead of re-flooding alerts. Backed by the
  # landing-zone competitive-intelligence-platform Aurora pgvector cluster.
  VECTOR_PROVIDER: pgvector
  CRAWL_INTERVAL_MINUTES: '60'
  SIGNIFICANCE_THRESHOLD: '0.3'
  # User-facing Slack surface — kept topical (owner-approved). Alerts post here.
  SLACK_ALERT_CHANNEL: '#competitive-intel'
  USER_AGENT: competitive-intelligence/0.1.0
  PORT: '3000'
  # MCP streamable-HTTP server port — the pull/query surface. Matches
  # service.mcpTargetPort and the deployment's mcp containerPort.
  MCP_PORT: '3001'
  # ─── MCP OAuth 2.1 resource-server protection ───
  # `none` (default) → the MCP port stays open, guarded by the mcp-tunnel +
  # NetworkPolicy alone (the current deployment posture). Flip to `workos` to
  # require a WorkOS AuthKit bearer token on /mcp — needed to add this surface as
  # a Claude custom connector over a public tunnel. When set to `workos`, also
  # set WORKOS_AUTHKIT_ISSUER and MCP_PUBLIC_URL (per-env, below). WorkOS is the
  # authorization server (its dashboard); this app is only the resource server,
  # so it holds NO client secret — token signatures verify against the public
  # WorkOS JWKS. See docs/mcp-oauth.md.
  MCP_AUTH: none
  # WorkOS AuthKit issuer + this server's canonical public /mcp URL (the RFC 8707
  # audience). Left unset here (empty → open mode); set both per-env when
  # MCP_AUTH=workos. Do NOT set them to empty strings — an empty value fails URL
  # validation; add the keys only when enabling auth.
  #   WORKOS_AUTHKIT_ISSUER: https://<tenant>.authkit.app
  #   MCP_PUBLIC_URL: https://<public-tunnel-host>/mcp
  NODE_ENV: production
  # OTel — exports to the grafana-agent OTLP receiver in the monitoring namespace,
  # which forwards traces → Tempo, metrics → AMP, logs → Loki. No per-pod sidecar.
  # Telemetry is initialized once, by the Dockerfile's
  # `--require @opentelemetry/auto-instrumentations-node/register` preload, so
  # all export config is env-driven here (no programmatic SDK in app code).
  OTEL_SERVICE_NAME: competitive-intelligence
  OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-agent.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: always_on
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: '60000'
  # fs spans are noise for a long-lived crawler — drop them at the preload.
  OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs
  # Resource attrs — agents.tenant/agents.platform required by PLATFORM_TENANT_CONTRACT.
  OTEL_RESOURCE_ATTRIBUTES: 'service.name=competitive-intelligence,service.version=0.1.0,agents.tenant=protohype,agents.platform=competitive-intelligence'

# Per-tenant infrastructure references — populated by per-env values from the
# landing-zone competitive-intelligence-platform component's outputs. Empty at
# the chart level for local dev (where the vector store may run in `memory`
# mode against a kind-side stub).
tenantInfra:
  # Aurora Serverless v2 (pgvector) endpoint — competitive-intelligence-platform:
  # module.aurora.cluster_endpoint (output: aurora_cluster_endpoint).
  pgHost: ''
  # competitive-intelligence-platform output: aurora_cluster_port.
  pgPort: '5432'
  # competitive-intelligence-platform: database_name.
  pgDatabase: competitive_intelligence

nodeSelector: {}
tolerations: []
affinity: {}
