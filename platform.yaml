# Platform CR — declares competitive-intelligence as a tenant of the protohype
# team on the eks-agent-platform operator. Apply once per cluster before the
# ApplicationSet entry starts reconciling the chart.
#
# Two CRs declared here:
#   - BudgetPolicy (referenced by Platform.spec.budget — required)
#   - Platform     (the actual tenant declaration)
#
# What the operator reconciles from the Platform CR:
#   - Namespace `tenants-protohype` (Pod Security Standards baseline)
#   - ResourceQuota + LimitRange
#   - Default-deny NetworkPolicy (the chart layers app-specific rules on top)
#   - ArgoCD AppProject scoped to this Platform
#   - Per-Platform IAM role (`<env>-competitive-intelligence-tenant`) with the
#     baseline policy + spec.identity.extraPolicyArns attached and Bedrock
#     invoke clamped to spec.identity.allowedModels (bedrock-model-scoping
#     inline policy). Trust is the EKS Pod Identity service principal; SAs
#     bind via Pod Identity associations (`tenant-runtime` by the operator,
#     the app SA by landing-zone)
#
# What this chart owns separately (NOT operator-reconciled):
#     The chart's own ServiceAccount (`competitive-intelligence`) is bound to
#     the operator-reconciled `<env>-competitive-intelligence-tenant` role by
#     an EKS Pod Identity association the landing-zone
#     competitive-intelligence-platform component creates — no role-arn
#     annotation. App pods and AgentFleet pods (`tenant-runtime` SA) share
#     that role: one Platform, one privilege domain. Bedrock access on the
#     role is the agent-iam baseline clamped to spec.identity below; the
#     app's substrate grants arrive via spec.identity.extraPolicyArns.
#
# Tenant substrate (Aurora pgvector, Secrets Manager seeding, the app-access
# managed policy) lives in landing-zone's
# components/aws/competitive-intelligence-platform/.
# Once that component's per-env entry applies, its outputs wire into the chart's
# per-env values (`tenantInfra.*`).

---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: competitive-intelligence
  namespace: tenants-protohype
spec:
  platformRef:
    name: competitive-intelligence
  # Sized for Bedrock spend: Claude Sonnet (Converse) on every above-threshold
  # diff + Titan embeddings on every chunk, every crawl. No per-query user
  # fan-out — spend is bounded by crawl interval × source count. Kill-switch
  # fires at 120% (USD 3000) when killSwitchEnabled is true.
  monthlyUsd: '2500'
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: competitive-intelligence
  namespace: tenants-protohype
spec:
  displayName: competitive-intelligence
  # Competitive intel is a marketing/strategy function.
  persona: marketing
  tenant: protohype
  budget:
    name: competitive-intelligence
  identity:
    # Bedrock model access for every pod in this Platform — the radar's
    # worker pod and AgentFleet pods share the operator-reconciled
    # `<env>-competitive-intelligence-tenant` role. The operator clamps
    # Bedrock invoke on that role to exactly these IDs
    # (bedrock-model-scoping inline policy over the baseline grant). Both
    # Sonnet generations are declared: the config default invokes Sonnet 4
    # (BEDROCK_LLM_MODEL), Sonnet 4.6 is the target the values will converge
    # on — dropping either is a spec edit once the config settles on one.
    allowedModels:
      - us.anthropic.claude-sonnet-4-20250514-v1:0 # BEDROCK_LLM_MODEL — diff analysis (Converse)
      - us.anthropic.claude-sonnet-4-6 # Sonnet 4.6 — convergence target for BEDROCK_LLM_MODEL
      - amazon.titan-embed-text-v2:0 # BEDROCK_EMBEDDING_MODEL — chunk embeddings
    # The app's substrate grants (Secrets Manager, CloudWatch) —
    # landing-zone's competitive-intelligence-platform component emits the
    # policy as `app_access_policy_arn`. Account-scoped, so it is filled per
    # environment at apply time (landing-zone
    # docs/runbooks/model-access-cutover.md):
    #   arn:aws:iam::<account>:policy/eks-agent-platform/competitive-intelligence-<env>-app-access
    extraPolicyArns: []
  compliance:
    soc2: true
  isolation: namespace
