name: evals

# The model tier, on its own workflow so it reports as its own check. Folding it
# into `ci` would let "tests passed" and "evals passed" arrive as one signal, and
# they are not one signal - the eval measures a model, needs credentials, and
# costs money per run.
#
# Manual only. There is no schedule and no pull_request/push trigger, which means
# there is no job condition either: dispatching the run IS the opt-in. That
# removes a whole failure class - a condition that silently skips while a comment
# claims otherwise, or a cron that goes red in a corner nobody reads. Run this
# before trusting a model change (a new pin, a prompt edit, a provider
# deprecation), which is when the answer actually matters. The offline tier in
# `ci` still covers fixture validity and the graders on every PR, fork or not.
#
# The eval role trusts `repo:<owner>/<name>:ref:refs/heads/main` and nothing else,
# so dispatch from main. A branch or fork cannot assume it - deliberately, because
# this identity can spend on metered inference.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: analyzeChanges golden set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Assume the eval role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ vars.EVAL_REGION || 'us-west-2' }}

      - name: Run the golden set
        # EVAL_LLM set means the tier must run: a broken provider fails here
        # rather than skipping, so a green check means the evals executed.
        run: npm run eval
        env:
          EVAL_LLM: bedrock
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          OTEL_SDK_DISABLED: 'true'
