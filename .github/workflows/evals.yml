name: evals

# The model tier, on its own workflow so it reports as its own check. Folding it
# into `ci` would let "tests passed" and "evals passed" arrive as one signal, and
# they are not one signal - the eval measures a model, needs credentials, and
# costs money per run.
#
# Manual only. There is no schedule and no pull_request/push trigger, which means
# there is no job condition either: dispatching the run IS the opt-in. That
# removes a whole failure class - a condition that silently skips while a comment
# claims otherwise, or a cron that goes red in a corner nobody reads. Run this
# before trusting a model change (a new pin, a prompt edit, a provider
# deprecation), which is when the answer actually matters. The offline tier in
# `ci` still covers fixture validity and the graders on every PR, fork or not.
#
# The eval role trusts `repo:<owner>/<name>:ref:refs/heads/main` and nothing else,
# so dispatch from main. A branch or fork cannot assume it - deliberately, because
# this identity can spend on metered inference.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: analyzeChanges golden set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Assume the eval role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ vars.EVAL_REGION || 'us-west-2' }}

      # The eval drives the same client the app does, against a ModelGateway.
      # In cluster that is the operator-published endpoint; CI has no cluster,
      # so it runs upstream's `aigw` — the same Envoy AI Gateway translation as
      # a local process. Pinned to the version eks-gitops deploys, because a
      # different one would translate differently and the eval would score a
      # path no environment runs.
      - name: Fetch aigw
        env:
          AIGW_VERSION: v1.0.0
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/aigw \
            "https://github.com/envoyproxy/ai-gateway/releases/download/${AIGW_VERSION}/aigw-linux-amd64"
          chmod +x /usr/local/bin/aigw
          aigw version || true

      # Generated from platform.yaml, so the routes and model ids are the ones
      # this app deploys rather than a second copy that drifts quietly.
      - name: Render the gateway config
        run: node scripts/render-eval-gateway.mjs --region "${{ vars.EVAL_REGION || 'us-west-2' }}" > /tmp/aigw.yaml

      # Backgrounded rather than a service container: it needs the AWS
      # credentials the OIDC step just put in this job's environment, which a
      # container would not inherit, and a generated config file.
      #
      # Readiness is `/health` on the extproc admin port — the only endpoint
      # that answers 200 on a working gateway. The data port is not a liveness
      # signal: every route matches on the `x-ai-eg-model` header, so a bare
      # `GET /` hits aigw's `route-not-found` rule and gets a deliberate 404,
      # which `curl -f` reports as failure. A probe there can never succeed.
      #
      # 180s because `aigw run` fetches its own Envoy build through func-e on a
      # cold runner before it binds anything; upstream's own e2e allows 120s
      # with the binary already local.
      - name: Start the gateway
        run: |
          set -euo pipefail
          aigw run /tmp/aigw.yaml > /tmp/aigw.log 2>&1 &
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null "http://localhost:1064/health" 2>/dev/null; then
              echo "gateway up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::aigw did not come up in 180s"
          cat /tmp/aigw.log
          exit 1

      - name: Run the golden set
        # EVAL_LLM set means the tier must run: a broken provider fails here
        # rather than skipping, so a green check means the evals executed.
        # `evals/wiring.test.ts` holds this value to what provider.ts accepts.
        run: npm run eval
        env:
          EVAL_LLM: gateway
          MODEL_GATEWAY_ENDPOINT: http://localhost:1975
          OTEL_SDK_DISABLED: 'true'

      # The gateway's own view of what happened. Without it a translation or
      # credential failure reads as the model refusing, which sends the next
      # person to the prompts.
      - name: Gateway log
        if: always()
        run: cat /tmp/aigw.log || true
