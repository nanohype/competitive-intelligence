name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        # `npm install` instead of `npm ci`: the lockfile is generated on
        # macOS and omits Linux platform-conditional optional deps that
        # vitest/rolldown pull in. `npm install` resolves them on the Linux
        # runner; version pinning comes from the lockfile regardless.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Audit (production deps, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # OTEL_SDK_DISABLED short-circuits the OTel SDK so the test run never
        # tries to reach the cluster collector. The metrics/tracing API
        # degrades to a no-op without a registered provider. --coverage enforces
        # the thresholds in vitest.config.ts so coverage can't silently regress.
        run: npm run test:coverage
        env:
          OTEL_SDK_DISABLED: 'true'

      - name: Build (emit dist)
        run: npm run build

  helm:
    name: Helm Lint + Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Helm lint chart
        run: helm lint chart

      # All three envs, and both sides of the optional-template toggles: a
      # values key that only exists on one branch of an `if` breaks the render
      # for exactly the deployments that flip it.
      #
      # `development` is rendered here as well as staging/production. It is the
      # env whose values file is edited least and read most (local runs, kx),
      # so it is the one most likely to rot unnoticed — and rendering it costs a
      # second. Tenant repos setting up this job should copy both steps: the
      # every-env render and the toggles-off/on matrix underneath it.
      - name: Helm template (development + staging + production)
        run: |
          mkdir -p rendered
          helm template competitive-intelligence chart -f chart/values-development.yaml > rendered/development.yaml
          helm template competitive-intelligence chart -f chart/values-staging.yaml > rendered/staging.yaml
          helm template competitive-intelligence chart -f chart/values-production.yaml > rendered/production.yaml

      - name: Helm template (optional templates forced off / on)
        run: |
          TOGGLES="prometheusRule grafanaDashboard externalSecret networkPolicy serviceMonitor"
          OFF=""; ON=""
          for t in $TOGGLES; do OFF="$OFF --set $t.enabled=false"; ON="$ON --set $t.enabled=true"; done
          for env in development staging production; do
            helm template competitive-intelligence chart -f "chart/values-$env.yaml" $OFF > /dev/null
            helm template competitive-intelligence chart -f "chart/values-$env.yaml" $ON > "rendered/$env-all-on.yaml"
          done

      # Source files are gated elsewhere; this asserts the RENDERED chart too —
      # a zero account id, placeholder token, or account-less ARN that only
      # appears after templating.
      - name: Assert no unfilled sentinels in rendered output
        uses: nanohype/nanohype/.github/actions/render-assert@main
        with:
          manifests: rendered

  platform-manifests:
    name: Platform Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install --prefer-offline --no-audit --no-fund

      # Tamper evidence, then the manifest itself. The validator hashes every
      # vendored schema against the SHA-256 recorded in source.json before
      # parsing it, so an edited copy — an enum widened to admit the value under
      # review, say — aborts the run instead of being trusted. That check needs
      # no network, so it holds on a laptop too. The second invocation is the
      # gate's self-test: it breaks the inputs in memory, including handing the
      # digest check a tampered schema, and fails unless every break is
      # rejected.
      - name: Validate platform.yaml against the CRD schemas
        run: npm run platform:validate

  crd-schema-drift:
    name: CRD schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The digests in schemas/crd/source.json prove the vendored copies were
      # not edited in place. They cannot prove the pin still describes them: a
      # ref bumped without re-vendoring, or a re-vendor without moving the ref,
      # leaves the digests internally consistent and upstream-wrong. This job is
      # that half. Checking the pinned SHA out — rather than a branch — is what
      # keeps it deterministic: the schema CI compares against cannot change
      # without a commit here that moves the pin.
      - name: Read the pinned operator ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository schemas/crd/source.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref schemas/crd/source.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout eks-agent-platform at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .eks-agent-platform

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Compares every vendored copy byte-for-byte against the operator repo at
      # the pinned SHA. The script refuses to run if the checkout's HEAD is not
      # that SHA, because a comparison against some other commit is a verdict
      # about a commit this repo never pinned. Nothing is skipped: an
      # unreachable checkout fails the job. Whether the pin itself has fallen
      # behind upstream is asked by the scheduled crd-schema-freshness workflow,
      # off the blocking path, so this check stays a pure function of the commit
      # under test.
      - name: Vendored CRD schemas match the pinned upstream commit
        run: npm run schemas:check
        env:
          EKS_AGENT_PLATFORM_DIR: .eks-agent-platform

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t competitive-intelligence:ci .

  vendor-drift:
    name: vendored copy drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every vendored surface (src/vendor/runtime modules, biome.base.json,
      # the tenant-chart-base chart, and the sync script itself) is a
      # byte-identical copy of its source of truth in
      # nanohype/nanohype, declared in scripts/vendored.json. A copy that
      # drifts is the defect — fixes propagate outward from the library,
      # never inward.
      - name: Checkout nanohype (vendored source of truth)
        uses: actions/checkout@v4
        with:
          repository: nanohype/nanohype
          path: .nanohype

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vendored copy drift check
        run: node scripts/sync-vendored.mjs --check
        env:
          NANOHYPE_DIR: .nanohype
