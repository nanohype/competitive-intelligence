name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        # `npm install` instead of `npm ci`: the lockfile is generated on
        # macOS and omits Linux platform-conditional optional deps that
        # vitest/rolldown pull in. `npm install` resolves them on the Linux
        # runner; version pinning comes from the lockfile regardless.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Audit (production deps, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # .editorconfig declares charset, LF endings, a final newline and no
      # trailing whitespace. Biome formats TS and JSON, so those rules hold for
      # part of the tree and are unobserved everywhere else — YAML, HCL,
      # Markdown, shell. This checks them across every git-tracked file.
      #
      # Indentation stays delegated: Go answers to gofmt, Terraform to tofu fmt,
      # TS and JSON to biome, and Make requires tabs for recipes and spaces for
      # the continuation lines inside them. A second opinion there would either
      # be wrong or demand churn, so this gate takes the rules nothing else owns
      # and names the ones it hands back.
      #
      # The gate reads the tree. It resolves no release and downloads no binary,
      # so the verdict a merge waits on does not depend on a third party
      # answering — and it distinguishes its two non-zero verdicts, so a red
      # check says whether a file is malformed or whether nothing was checked
      # at all. It self-tests before it reads anything: a gate that has quietly
      # stopped rejecting passes every tree, and the tree it passed looks
      # exactly like one that conforms.
      #
      # Shared with the rest of the estate rather than copied into it, so an
      # edge case is fixed once and reaches every consumer as a pin move with a
      # diff, instead of as five hand-copied readings of one rule.
      - name: Editorconfig
        uses: nanohype/.github/actions/editorconfig-gate@b2eada74413fcc9f3042f22126ee5b350a2b846e

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # OTEL_SDK_DISABLED short-circuits the OTel SDK so the test run never
        # tries to reach the cluster collector. The metrics/tracing API
        # degrades to a no-op without a registered provider. --coverage enforces
        # the thresholds in vitest.config.ts so coverage can't silently regress.
        run: npm run test:coverage
        env:
          OTEL_SDK_DISABLED: 'true'

      - name: Build (emit dist)
        run: npm run build

  docs:
    name: docs
    runs-on: ubuntu-latest
    # Its own job because FOUR_PHASE_CONTRACT wants build, lint, test and docs
    # as four separately-failing phases. It was previously satisfied by an
    # `echo`, which exits 0 and regenerates nothing — a phase that cannot fail
    # is not a phase, and nothing here invoked it anyway.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Generate the API reference
        run: npm run docs

  helm:
    name: Helm Lint + Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Helm lint chart
        run: helm lint chart

      # All three envs, and both sides of the optional-template toggles: a
      # values key that only exists on one branch of an `if` breaks the render
      # for exactly the deployments that flip it.
      #
      # `development` is rendered here as well as staging/production. It is the
      # env whose values file is edited least and read most (local runs, kx),
      # so it is the one most likely to rot unnoticed — and rendering it costs a
      # second. Tenant repos setting up this job should copy both steps: the
      # every-env render and the toggles-off/on matrix underneath it.
      - name: Helm template (development + staging + production)
        run: |
          mkdir -p rendered
          helm template competitive-intelligence chart -f chart/values-development.yaml > rendered/development.yaml
          helm template competitive-intelligence chart -f chart/values-staging.yaml > rendered/staging.yaml
          helm template competitive-intelligence chart -f chart/values-production.yaml > rendered/production.yaml

      - name: Helm template (optional templates forced off / on)
        run: |
          TOGGLES="prometheusRule grafanaDashboard externalSecret networkPolicy serviceMonitor"
          OFF=""; ON=""
          for t in $TOGGLES; do OFF="$OFF --set $t.enabled=false"; ON="$ON --set $t.enabled=true"; done
          for env in development staging production; do
            helm template competitive-intelligence chart -f "chart/values-$env.yaml" $OFF > /dev/null
            helm template competitive-intelligence chart -f "chart/values-$env.yaml" $ON > "rendered/$env-all-on.yaml"
          done

      # Source files are gated elsewhere; this asserts the RENDERED chart too —
      # a zero account id, placeholder token, or account-less ARN that only
      # appears after templating.
      - name: DNS egress is scoped to kube-dns, not to all of kube-system
        run: |
          # A NetworkPolicy `to:` list is a list of PEERS, and peers are OR'd.
          # namespaceSelector and podSelector AND each other only inside ONE peer;
          # as two sibling list items they mean "every pod in kube-system" OR
          # "every same-namespace pod labelled k8s-app=kube-dns". Both forms render,
          # both are valid, both lint clean, and only one of them is DNS-only —
          # which is how the OR shipped here and in three sibling charts.
          python3 - <<'EOF'
          import glob, sys, yaml
          checked = 0
          for path in sorted(glob.glob("rendered/*.yaml")):
              for doc in yaml.safe_load_all(open(path)):
                  if not doc or doc.get("kind") != "NetworkPolicy":
                      continue
                  for rule in (doc["spec"].get("egress") or []):
                      ports = [str(p.get("port")) for p in (rule.get("ports") or [])]
                      if "53" not in ports:
                          continue
                      checked += 1
                      for peer in (rule.get("to") or []):
                          if "namespaceSelector" in peer and "podSelector" not in peer:
                              sys.exit(
                                  f"{path}: the DNS egress rule has a namespaceSelector "
                                  f"peer with no podSelector, so it allows egress to EVERY "
                                  f"pod in that namespace. Put both selectors in one peer."
                              )
          if not checked:
              sys.exit("no DNS egress rule found in rendered/ — this check verified nothing")
          print(f"ok  {checked} DNS egress rule(s) scope to kube-dns, not to a whole namespace")
          EOF
      - name: Assert no unfilled sentinels in rendered output
        uses: nanohype/nanohype/.github/actions/render-assert@main
        with:
          manifests: rendered

  platform-manifests:
    name: Platform Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install --prefer-offline --no-audit --no-fund

      # Tamper evidence, then the manifest itself. The validator hashes every
      # vendored schema against the SHA-256 recorded in source.json before
      # parsing it, so an edited copy — an enum widened to admit the value under
      # review, say — aborts the run instead of being trusted. That check needs
      # no network, so it holds on a laptop too. The second invocation is the
      # gate's self-test: it breaks the inputs in memory, including handing the
      # digest check a tampered schema, and fails unless every break is
      # rejected.
      - name: Validate platform.yaml against the CRD schemas
        run: npm run platform:validate

  crd-schema-drift:
    name: CRD schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The digests in schemas/crd/source.json prove the vendored copies were
      # not edited in place. They cannot prove the pin still describes them: a
      # ref bumped without re-vendoring, or a re-vendor without moving the ref,
      # leaves the digests internally consistent and upstream-wrong. This job is
      # that half. Checking the pinned SHA out — rather than a branch — is what
      # keeps it deterministic: the schema CI compares against cannot change
      # without a commit here that moves the pin.
      - name: Read the pinned operator ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository schemas/crd/source.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref schemas/crd/source.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout eks-agent-platform at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .eks-agent-platform

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Compares every vendored copy byte-for-byte against the operator repo at
      # the pinned SHA. The script refuses to run if the checkout's HEAD is not
      # that SHA, because a comparison against some other commit is a verdict
      # about a commit this repo never pinned. Nothing is skipped: an
      # unreachable checkout fails the job. Whether the pin itself has fallen
      # behind upstream is asked by the scheduled crd-schema-freshness workflow,
      # off the blocking path, so this check stays a pure function of the commit
      # under test.
      - name: Vendored CRD schemas match the pinned upstream commit
        run: npm run schemas:check
        env:
          EKS_AGENT_PLATFORM_DIR: .eks-agent-platform

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t competitive-intelligence:ci .

  vendor-drift:
    name: vendored copy drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every vendored surface (src/vendor/runtime modules, biome.base.json,
      # the tenant-chart-base chart, and the sync script itself) is a
      # byte-identical copy of its source of truth in
      # nanohype/nanohype, declared in scripts/vendored.json. A copy that
      # drifts is the defect — fixes propagate outward from the library,
      # never inward.
      - name: Read the pinned nanohype ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository scripts/vendored.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref scripts/vendored.json)" >> "$GITHUB_OUTPUT"

      # Checked out at the pinned commit, not at main. Comparing against main
      # would make this required check a verdict about nanohype's latest merge
      # rather than about the commit under test — any library change upstream
      # would turn this repository red without a commit here. Whether the pin
      # has fallen behind is asked by the scheduled vendored-freshness
      # workflow, off the blocking path.
      - name: Checkout nanohype at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .nanohype

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vendored copy drift check
        run: node scripts/sync-vendored.mjs --check
        env:
          NANOHYPE_DIR: .nanohype

      # The gate's own guards, exercised rather than assumed. It vendors into a
      # scratch root from the same pinned checkout the step above reads, then
      # breaks the inputs every rule exists to catch — a branch name where a SHA
      # is required, a pin no checkout contains, an edited copy, an unexpected
      # or deleted file in a vendored tree, an undeclared module in an exclusive
      # directory — and fails unless each one is rejected.
      - name: Vendored copy gate self-test
        run: node scripts/sync-vendored.mjs --self-test
        env:
          NANOHYPE_DIR: .nanohype

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        verify,
        docs,
        helm,
        platform-manifests,
        crd-schema-drift,
        docker,
        vendor-drift,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
