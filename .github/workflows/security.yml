name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Tuesday 06:00 UTC — catches new CVEs even when no PRs land.
    - cron: '0 6 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The official gitleaks-action gates organization repos behind a paid
      # license; the gitleaks CLI itself is free. Pin and run it directly.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  trivy-config:
    name: trivy (dockerfile misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report step: ALWAYS produce + upload a clean SARIF (exit-code 0) so
      # code scanning records a SUCCESSFUL analysis. Coupling the SARIF run with
      # the build gate (exit-code 1) makes Trivy mark the SARIF invocation
      # unsuccessful whenever a finding exists, which GitHub surfaces as
      # "Trivy is reporting errors" / a code-scanning configuration error.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          # Scoped to the Dockerfile — the one config artifact this repo owns
          # and can remediate. The Helm chart is covered by the ci workflow's
          # Helm Lint + Template job; platform.yaml is covered by its Platform
          # Manifest Validation job, which checks the CRs against the operator's
          # own CRD schemas. Neither those CRs nor
          # gitops/applicationset-entry.yaml (an ArgoCD ApplicationSet) are
          # standard workloads, so trivy's generic Kubernetes checks misfire on
          # them rather than surfacing real findings.
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '0'
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      # Gate step: fail the build on HIGH/CRITICAL, reusing the DB the report
      # step already downloaded (skip-db-update). Separate from the SARIF upload
      # so a finding fails CI without poisoning the code-scanning analysis.
      - name: gate on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          skip-db-update: true

  trivy-fs:
    name: trivy (filesystem vuln scan — npm deps)
    runs-on: ubuntu-latest
    env:
      # trivy's npm/pnpm parser drops dev dependencies unless told otherwise, so
      # this job reported zero findings while the lockfile carried a fixable HIGH.
      # A build-time dependency still executes in CI with repo credentials, which
      # is the surface this gate exists to cover, and the sibling repos scanning
      # the same tree with osv-scanner have always counted them — the two tools
      # disagreed on the same advisory in the same org. trivy-action exposes no
      # input for it; the flag is only reachable as its TRIVY_-prefixed env var.
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - uses: actions/checkout@v4
      # Report step: always upload a clean SARIF (exit-code 0) — see trivy-config.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Dependency vulns only. Secret scanning is gitleaks' job (above) and
          # misconfig is the trivy-config job's. ignore-unfixed keeps the gate
          # to actionable (patch-available) CVEs.
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: 'node_modules'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # Gate step: fail the build on HIGH/CRITICAL, reusing the cached DB.
      - name: gate on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-dirs: 'node_modules'
          skip-db-update: true

  merge-gate-security:
    name: merge gate (security)
    runs-on: ubuntu-latest
    needs:
      [
        gitleaks,
        trivy-config,
        trivy-fs,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate-security
