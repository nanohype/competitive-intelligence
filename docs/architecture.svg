<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; rx: 8; }
      .card-hi { fill: #161B22; stroke: #34D399; stroke-width: 1.5; rx: 8; }
      .card-blue { fill: #161B22; stroke: #58A6FF; stroke-width: 1.5; rx: 8; }
      .card-purple { fill: #161B22; stroke: #D2A8FF; stroke-width: 1.5; rx: 8; }
      .card-orange { fill: #161B22; stroke: #FFA657; stroke-width: 1.5; rx: 8; }
      .title { fill: #E6EDF3; font-size: 13px; font-weight: 600; }
      .sub { fill: #8B949E; font-size: 10px; }
      .note { fill: #6E7681; font-size: 8px; font-style: italic; }
      .label { fill: #34D399; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; }
      .heading { fill: #E6EDF3; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
      .dim { fill: #8B949E; font-size: 11px; }
      .sec { fill: #34D399; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
      .cmd { fill: #8B949E; font-size: 9px; font-family: 'SF Mono', 'Fira Code', monospace; }
      .arrow { stroke: #30363D; stroke-width: 1; fill: none; }
      .arrow-head { fill: #30363D; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="560"/>

  <!-- Header -->
  <text class="heading" x="40" y="36">competitive-intelligence — Competitive Intelligence Radar</text>
  <text class="dim" x="40" y="52">Crawl competitor sites · semantic diff · LLM analysis · Slack alerts · MCP query surface</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT PANEL: Data Flow                               -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- INGEST -->
  <text class="sec" x="40" y="82">INGEST</text>

  <rect class="card-hi" x="40" y="90" width="160" height="52"/>
  <text class="title" x="52" y="108">sources.json</text>
  <text class="sub" x="52" y="122">competitor URLs + selectors</text>
  <text class="note" x="52" y="136">Zod-validated on load</text>

  <line class="arrow" x1="200" y1="116" x2="222" y2="116"/>
  <polygon class="arrow-head" points="222,113 228,116 222,119"/>

  <rect class="card" x="230" y="90" width="140" height="52"/>
  <text class="title" x="242" y="108">Scheduler</text>
  <text class="sub" x="242" y="122">fixed interval · mutex</text>
  <text class="note" x="242" y="136">single writer</text>

  <line class="arrow" x1="370" y1="116" x2="392" y2="116"/>
  <polygon class="arrow-head" points="392,113 398,116 392,119"/>

  <rect class="card" x="400" y="90" width="180" height="52"/>
  <text class="title" x="412" y="108">Crawler</text>
  <text class="sub" x="412" y="122">fetch · cheerio · per-host breaker</text>
  <text class="note" x="412" y="136">SSRF-guarded outbound URLs</text>

  <!-- Arrow down from Crawler to Pipeline -->
  <line class="arrow" x1="490" y1="142" x2="490" y2="164"/>
  <polygon class="arrow-head" points="487,164 493,164 490,170"/>

  <!-- PROCESS -->
  <text class="sec" x="40" y="186">PROCESS</text>

  <rect class="card-purple" x="40" y="194" width="300" height="52"/>
  <text class="title" x="52" y="212">Pipeline</text>
  <text class="sub" x="52" y="226">chunk → embed → semantic diff → replace</text>
  <text class="note" x="52" y="240">cold-start baseline guard</text>

  <line class="arrow" x1="340" y1="220" x2="392" y2="220"/>
  <polygon class="arrow-head" points="392,217 398,220 392,223"/>

  <rect class="card-hi" x="400" y="194" width="180" height="52"/>
  <text class="title" x="412" y="212">Vector Store</text>
  <text class="sub" x="412" y="226">pgvector (Aurora) · cosine</text>
  <text class="note" x="412" y="240">in-memory backend for dev</text>

  <!-- Arrow down from Pipeline to Alert Engine -->
  <line class="arrow" x1="190" y1="246" x2="190" y2="274"/>
  <polygon class="arrow-head" points="187,274 193,274 190,280"/>
  <text x="118" y="268" fill="#FFA657" font-size="8" font-weight="500">significant changes</text>

  <!-- Arrow down from Vector Store to Intel Engine -->
  <line class="arrow" x1="490" y1="246" x2="490" y2="274"/>
  <polygon class="arrow-head" points="487,274 493,274 490,280"/>
  <text x="500" y="268" fill="#58A6FF" font-size="8" font-weight="500">retrieve</text>

  <!-- ANALYZE -->
  <text class="sec" x="40" y="296">ANALYZE</text>

  <rect class="card-orange" x="40" y="304" width="240" height="52"/>
  <text class="title" x="52" y="322">Alert Engine</text>
  <text class="sub" x="52" y="336">threshold gate · LLM analysis</text>
  <text class="note" x="52" y="350">deterministic Block Kit formatting</text>

  <rect class="card-blue" x="400" y="304" width="180" height="52"/>
  <text class="title" x="412" y="322">Intel Engine</text>
  <text class="sub" x="412" y="336">retrieve · composed answers</text>
  <text class="note" x="412" y="350">one retrieval path, two exits</text>

  <!-- Arrow down from Alert Engine to Slack sink -->
  <line class="arrow" x1="130" y1="356" x2="130" y2="410"/>
  <polygon class="arrow-head" points="127,410 133,410 130,416"/>

  <!-- Arrow down from Intel Engine to MCP server -->
  <path class="arrow" d="M 445 356 L 445 386 L 350 386 L 350 410"/>
  <polygon class="arrow-head" points="347,410 353,410 350,416"/>
  <text x="360" y="382" fill="#58A6FF" font-size="8" font-weight="500">context</text>

  <!-- Arrow down from Intel Engine to CLI -->
  <line class="arrow" x1="530" y1="356" x2="530" y2="410"/>
  <polygon class="arrow-head" points="527,410 533,410 530,416"/>

  <!-- INTERFACE -->
  <text class="sec" x="40" y="408">INTERFACE</text>

  <rect class="card-orange" x="40" y="416" width="180" height="52"/>
  <text class="title" x="52" y="434">Slack sink</text>
  <text class="sub" x="52" y="448">outbound chat.postMessage</text>
  <text class="note" x="52" y="462">#competitive-intel</text>

  <rect class="card-blue" x="240" y="416" width="220" height="52"/>
  <text class="title" x="252" y="434">MCP server</text>
  <text class="sub" x="252" y="448">search_intel · trigger_crawl</text>
  <text class="note" x="252" y="462">streamable HTTP · optional OAuth 2.1</text>

  <rect class="card" x="480" y="416" width="100" height="52"/>
  <text class="title" x="492" y="434">CLI</text>
  <text class="sub" x="492" y="448">crawl · query</text>
  <text class="note" x="492" y="462">ANSI terminal UI</text>

  <text class="note" x="40" y="488">Claude surfaces reach the MCP server through the mcp-tunnel — the only ingress the NetworkPolicy admits</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL: Inference + tenancy                    -->
  <!-- ═══════════════════════════════════════════════════ -->

  <rect class="card" x="640" y="78" width="530" height="200" rx="12"/>
  <text class="sec" x="660" y="100">POWERED BY AWS BEDROCK</text>

  <rect x="660" y="110" width="240" height="44" rx="6" fill="#1C2333" stroke="#34D399" stroke-width="1" opacity="0.8"/>
  <text class="label" x="676" y="126">LLM</text>
  <text class="sub" x="676" y="142">Claude Sonnet via Converse API</text>

  <rect x="910" y="110" width="240" height="44" rx="6" fill="#1C2333" stroke="#34D399" stroke-width="1" opacity="0.8"/>
  <text class="label" x="926" y="126">EMBEDDINGS</text>
  <text class="sub" x="926" y="142">Titan v2 · 1024 dimensions</text>

  <rect x="660" y="164" width="490" height="44" rx="6" fill="#1C2333" stroke="#30363D" stroke-width="1"/>
  <text x="676" y="180" fill="#FFA657" font-size="9" font-weight="600" letter-spacing="0.1em">PROMPT CACHING</text>
  <text class="sub" x="676" y="196">Converse cachePoint after the analysis system prompt — hit ratio exported to AMP</text>

  <rect x="660" y="218" width="490" height="48" rx="6" fill="#1C2333" stroke="#30363D" stroke-width="1"/>
  <text x="676" y="234" fill="#8B949E" font-size="9" font-weight="600" letter-spacing="0.1em">NO API KEYS</text>
  <text class="sub" x="676" y="250">AWS credential chain — EKS Pod Identity in cluster, SSO or ~/.aws locally</text>

  <!-- ─── Platform tenancy ─── -->
  <rect class="card" x="640" y="296" width="530" height="96" rx="12"/>
  <text class="sec" x="660" y="318">PLATFORM TENANT</text>

  <text class="sub" x="660" y="338">team strategy · platform competitive-intelligence</text>
  <text class="sub" x="660" y="356">workload namespace tenants-competitive-intelligence · AppProject competitive-intelligence</text>
  <text class="sub" x="660" y="374">replicaCount 1 (single writer) · default-deny NetworkPolicy · no public ingress</text>

  <!-- ─── Tech Stack ─── -->
  <rect class="card" x="640" y="410" width="530" height="60" rx="12"/>
  <text class="sec" x="660" y="432">TECH STACK</text>
  <text class="sub" x="660" y="448">TypeScript · ESM · Node ≥ 24 · Zod · cheerio · pgvector · MCP SDK</text>
  <text class="sub" x="660" y="462">provider registry · sliding-window circuit breakers · cosine similarity</text>

  <!-- ─── Footer ─── -->
  <text class="dim" x="40" y="520">nanohype/competitive-intelligence — a nanohype Platform tenant</text>
  <text class="cmd" x="40" y="536">cp .env.example .env &amp;&amp; cp sources.example.json sources.json &amp;&amp; npm run crawl</text>

</svg>
